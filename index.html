    <title>L3 Design System · Lemonnade V3</title>
    <script>
      // Apply the stored L3 theme before first paint (mirrors src/theme/ThemeProvider.tsx).
      (function () {
        var s = {};
        try { s = JSON.parse(localStorage.getItem('l3-theme') || '{}') } catch (e) {}
        var p = ['lm', 'cspro', 'kuber'].indexOf(s.product) >= 0 ? s.product : 'lm';
        var m = s.mode === 'light' || s.mode === 'dark' ? s.mode
          : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        if (p === 'cspro') m = 'dark';
        document.documentElement.dataset.product = p;
        document.documentElement.dataset.mode = m;
        if (s.contrast === 'accessible') document.documentElement.dataset.contrast = 'accessible';
      })();
    </script>
